name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: codex_audit
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: audit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_audit -d audit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:postgres
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://codex_audit:test-only-password@127.0.0.1:5432/audit_ci
